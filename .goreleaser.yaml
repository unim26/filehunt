version: 2

project_name: filehunt

builds:
  - env:
      - CGO_ENABLED=0
    # Point GoReleaser to where your main.go actually is located
    main: ./internal/main.go
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"
